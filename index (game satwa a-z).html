<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dunia Satwa A-Z</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --kuning:#F2D211; --hijau:#85B885; --hijau-tua:#2F6B3A; --ungu:#F0E8FF; --coklat:#A87C7C; --oranye:#F28C28; --teks:#2B1E10; }
  html, body { height:100%; }
  body { font-family:'Fredoka','Comic Sans MS','Trebuchet MS',sans-serif; background:var(--kuning); color:var(--teks); margin:0; overflow-x:hidden; -webkit-tap-highlight-color:transparent; }
  .judul { text-shadow: 3px 3px 0 #fff6b8, -2px -2px 0 #fff6b8, 2px -2px 0 #fff6b8, -2px 2px 0 #fff6b8; }
  .btn { border:none; border-radius:9999px; font-weight:700; cursor:pointer; transition:transform .15s, box-shadow .15s; box-shadow:0 6px 0 rgba(0,0,0,.2); }
  .btn:hover { transform:translateY(-2px); }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.2); }
  .btn:focus-visible, .huruf:focus-visible, .pilihan:focus-visible, .kartu:focus-visible { outline:4px solid #1d4ed8; outline-offset:3px; }
  .kartu { background:var(--ungu); border:6px dashed var(--coklat); border-radius:28px; box-shadow:0 10px 0 rgba(0,0,0,.18); cursor:pointer; perspective:800px; }
  .kartu-isi { animation:muncul .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes muncul { from { transform:scale(.7) rotate(-6deg); opacity:0; } to { transform:scale(1) rotate(0); opacity:1; } }
  .goyang { animation:goyang .6s ease; }
  @keyframes goyang { 0%,100%{transform:rotate(0)} 20%{transform:rotate(-12deg) scale(1.1)} 50%{transform:rotate(12deg) scale(1.1)} 80%{transform:rotate(-6deg)} }
  .melayang { animation:melayang 3s ease-in-out infinite; }
  @keyframes melayang { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  .huruf { width:100%; aspect-ratio:1; border-radius:14px; border:3px solid #fff; background:#fff8cf; font-weight:700; font-size:1.2rem; cursor:pointer; transition:transform .12s; }
  .huruf:hover { transform:scale(1.12); background:#ffe66b; }
  .huruf.aktif { background:var(--oranye); color:#fff; transform:scale(1.1); }
  .pilihan { background:#fff; border:5px solid var(--hijau); border-radius:24px; font-weight:700; cursor:pointer; transition:transform .15s; box-shadow:0 6px 0 rgba(0,0,0,.15); }
  .pilihan:hover:not(:disabled) { transform:translateY(-3px); background:#f1ffe9; }
  .pilihan.benar { background:#8be28b; border-color:#2e9b2e; animation:loncat .5s; }
  .pilihan.salah { background:#ffb3b3; border-color:#d33; animation:goyang .5s; }
  @keyframes loncat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
  .konfeti { position:fixed; top:-40px; font-size:2rem; pointer-events:none; z-index:50; animation:jatuh 1.8s linear forwards; }
  @keyframes jatuh { to { transform:translateY(110vh) rotate(540deg); opacity:.9; } }
  .layar { display:none; } .layar.tampil { display:flex; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

  /* ===== Utilitas CSS lokal (pengganti Tailwind CDN, tanpa peringatan produksi) ===== */
  *,::before,::after{box-sizing:border-box}
  h1,h2,p{margin:0;font-size:inherit;font-weight:inherit}
  button{font-family:inherit;font-size:100%;background:none;padding:0;color:inherit;text-align:center}
  .min-h-screen{min-height:100vh}.w-full{width:100%}.flex{display:flex}.grid{display:grid}.hidden{display:none}
  .flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}.flex-1{flex:1 1 0%}
  .items-center{align-items:center}.justify-center{justify-content:center}.justify-between{justify-content:space-between}.self-start{align-self:flex-start}
  .text-center{text-align:center}.relative{position:relative}.overflow-hidden{overflow:hidden}.select-none{user-select:none}
  .gap-2{gap:.5rem}.gap-3{gap:.75rem}.gap-4{gap:1rem}.gap-5{gap:1.25rem}.gap-6{gap:1.5rem}
  .p-4{padding:1rem}.p-5{padding:1.25rem}.px-3{padding-left:.75rem;padding-right:.75rem}.px-4{padding-left:1rem;padding-right:1rem}
  .px-5{padding-left:1.25rem;padding-right:1.25rem}.px-6{padding-left:1.5rem;padding-right:1.5rem}.px-8{padding-left:2rem;padding-right:2rem}
  .py-2{padding-top:.5rem;padding-bottom:.5rem}.py-3{padding-top:.75rem;padding-bottom:.75rem}.py-4{padding-top:1rem;padding-bottom:1rem}
  .py-5{padding-top:1.25rem;padding-bottom:1.25rem}.py-6{padding-top:1.5rem;padding-bottom:1.5rem}.pb-4{padding-bottom:1rem}
  .mt-1{margin-top:.25rem}.mt-2{margin-top:.5rem}.mt-6{margin-top:1.5rem}
  .max-w-md{max-width:28rem}.max-w-2xl{max-width:42rem}.max-w-3xl{max-width:48rem}
  .w-16{width:4rem}.h-16{height:4rem}.h-4{height:1rem}.h-9{height:2.25rem}.h-full{height:100%}
  .grid-cols-1{grid-template-columns:repeat(1,minmax(0,1fr))}.grid-cols-7{grid-template-columns:repeat(7,minmax(0,1fr))}
  .rounded-full{border-radius:9999px}.bg-white{background:#fff}.bg-green-200{background:#bbf7d0}.bg-red-200{background:#fecaca}.bg-white\/70{background:rgba(255,255,255,.7)}
  .text-white{color:#fff}.opacity-60{opacity:.6}.opacity-70{opacity:.7}.transition-all{transition:all .3s}
  .font-medium{font-weight:500}.font-semibold{font-weight:600}.font-bold{font-weight:700}
  .leading-tight{line-height:1.25}.leading-none{line-height:1}.tracking-wide{letter-spacing:.025em}
  .text-sm{font-size:.875rem;line-height:1.25rem}.text-lg{font-size:1.125rem;line-height:1.75rem}.text-xl{font-size:1.25rem;line-height:1.75rem}
  .text-2xl{font-size:1.5rem;line-height:2rem}.text-3xl{font-size:1.875rem;line-height:2.25rem}.text-4xl{font-size:2.25rem;line-height:2.5rem}
  .text-5xl{font-size:3rem;line-height:1}.text-6xl{font-size:3.75rem;line-height:1}.text-7xl{font-size:4.5rem;line-height:1}
  .text-8xl{font-size:6rem;line-height:1}.text-9xl{font-size:8rem;line-height:1}
  .text-\[7\.5rem\]{font-size:7.5rem}.text-\[6\.5rem\]{font-size:6.5rem}
  @media (min-width:640px){
    .sm\:grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.sm\:grid-cols-9{grid-template-columns:repeat(9,minmax(0,1fr))}
    .sm\:text-xl{font-size:1.25rem;line-height:1.75rem}.sm\:text-2xl{font-size:1.5rem;line-height:2rem}.sm\:text-3xl{font-size:1.875rem;line-height:2.25rem}
    .sm\:text-5xl{font-size:3rem;line-height:1}.sm\:text-6xl{font-size:3.75rem;line-height:1}.sm\:text-8xl{font-size:6rem;line-height:1}.sm\:text-9xl{font-size:8rem;line-height:1}
    .sm\:text-\[9rem\]{font-size:9rem}.sm\:text-\[8rem\]{font-size:8rem}
  }
</style>
</head>
<body>
<div id="app" class="min-h-screen w-full flex flex-col" style="padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)">

  <!-- MENU UTAMA -->
  <section id="menu" class="layar tampil flex-col items-center justify-center text-center gap-6 flex-1 p-5">
    <div class="text-5xl melayang" aria-hidden="true">🦋 🌴 🦋</div>
    <h1 class="judul text-4xl sm:text-6xl font-bold leading-tight">DUNIA SATWA A-Z</h1>
    <p class="text-xl sm:text-2xl font-medium">Flashcard untuk Anak Pintar</p>
    <div class="text-5xl sm:text-6xl flex gap-2 flex-wrap justify-center" aria-hidden="true">🐵 🦜 🐸 🐯 🐘</div>
    <div class="flex flex-col gap-5 w-full max-w-md mt-2">
      <button class="btn text-2xl sm:text-3xl py-6 px-6 text-white" style="background:#3BA55D" onclick="bukaFlashcard(0)">📖 Belajar Flashcard</button>
      <button class="btn text-2xl sm:text-3xl py-6 px-6 text-white" style="background:#E8590C" onclick="mulaiKuis()">🎮 Main Kuis Tebak Hewan</button>
    </div>
    <p class="text-sm opacity-70 mt-2">Nyalakan suara perangkatmu agar hewan bisa berbicara 🔊</p>
  </section>

  <!-- FLASHCARD -->
  <section id="flash" class="layar flex-col items-center gap-4 flex-1 p-4" style="background:var(--hijau)">
    <div class="w-full max-w-3xl flex items-center justify-between">
      <button class="btn bg-white text-lg px-5 py-3" onclick="keMenu()" aria-label="Kembali ke menu">🏠 Menu</button>
      <h2 class="text-xl sm:text-2xl font-bold text-white" style="text-shadow:2px 2px 0 rgba(0,0,0,.25)">Belajar Flashcard</h2>
      <button class="btn bg-white text-lg px-5 py-3" onclick="mulaiKuis()" aria-label="Pindah ke kuis">🎮 Kuis</button>
    </div>

    <div id="kartu" class="kartu w-full max-w-md flex-1 flex flex-col items-center justify-between p-5 relative" style="min-height:360px;max-height:560px" tabindex="0" role="button" aria-label="Kartu hewan, tekan untuk mendengar suara" onclick="bicara()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();bicara()}">
      <div id="kHuruf" class="self-start text-8xl sm:text-9xl font-bold leading-none">A</div>
      <div id="kEmoji" class="kartu-isi text-[7.5rem] sm:text-[9rem] leading-none select-none" aria-hidden="true">🐔</div>
      <div id="kNama" class="text-4xl sm:text-5xl font-bold tracking-wide">AYAM</div>
      <div id="kHalaman" class="text-sm opacity-60 mt-1">Kartu 1 dari 26</div>
    </div>

    <div class="flex items-center gap-3 w-full max-w-md justify-between">
      <button id="btnPrev" class="btn bg-white text-xl sm:text-2xl px-5 py-4" onclick="geser(-1)">⬅️ Sebelumnya</button>
      <button class="btn text-white text-3xl w-16 h-16 flex items-center justify-center" style="background:var(--oranye)" onclick="bicara()" aria-label="Putar suara">🔊</button>
      <button id="btnNext" class="btn bg-white text-xl sm:text-2xl px-5 py-4" onclick="geser(1)">Lanjut ➡️</button>
    </div>

    <div id="grid" class="grid grid-cols-7 sm:grid-cols-9 gap-2 w-full max-w-2xl mt-1 pb-4" role="group" aria-label="Pilih huruf"></div>
  </section>

  <!-- KUIS -->
  <section id="kuis" class="layar flex-col items-center gap-4 flex-1 p-4" style="background:#FFD966">
    <div class="w-full max-w-2xl flex items-center justify-between">
      <button class="btn bg-white text-lg px-5 py-3" onclick="keMenu()" aria-label="Kembali ke menu">🏠 Menu</button>
      <div class="flex gap-2 text-lg font-bold">
        <span class="bg-white rounded-full px-4 py-2">⭐ <span id="sSkor">0</span></span>
        <span class="bg-green-200 rounded-full px-4 py-2">✅ <span id="sBenar">0</span></span>
        <span class="bg-red-200 rounded-full px-4 py-2">❌ <span id="sSalah">0</span></span>
      </div>
    </div>
    <div class="w-full max-w-2xl h-4 bg-white/70 rounded-full overflow-hidden"><div id="bar" class="h-full rounded-full transition-all" style="width:0;background:var(--oranye)"></div></div>
    <p id="soalKe" class="font-semibold">Soal 1 dari 10</p>

    <div id="soalBox" class="flex flex-col items-center gap-3 w-full max-w-2xl">
      <p id="tanya" class="text-2xl sm:text-3xl font-bold text-center">Hewan apa ini?</p>
      <div class="kartu flex items-center justify-center gap-6 px-8 py-6" style="cursor:default">
        <div id="qHuruf" class="text-7xl sm:text-8xl font-bold">A</div>
        <div id="qEmoji" class="text-[6.5rem] sm:text-[8rem] leading-none melayang" aria-hidden="true">🐔</div>
      </div>
      <button class="btn bg-white text-xl px-6 py-3" onclick="bacaSoal()">🔊 Dengar lagi</button>
      <div id="pilihan" class="grid grid-cols-1 sm:grid-cols-3 gap-4 w-full mt-2"></div>
      <p id="umpan" class="text-2xl font-bold h-9 text-center" aria-live="polite"></p>
    </div>

    <div id="hasil" class="hidden flex-col items-center gap-4 text-center mt-6">
      <div class="text-8xl melayang" aria-hidden="true">🏆</div>
      <h2 class="judul text-4xl font-bold">Hebat sekali!</h2>
      <p id="hasilTeks" class="text-2xl font-semibold"></p>
      <div id="bintang" class="text-5xl" aria-hidden="true"></div>
      <div class="flex gap-4 flex-wrap justify-center">
        <button class="btn text-white text-2xl px-8 py-5" style="background:#E8590C" onclick="mulaiKuis()">🔁 Main Lagi</button>
        <button class="btn text-white text-2xl px-8 py-5" style="background:#3BA55D" onclick="bukaFlashcard(0)">📖 Belajar</button>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
  'use strict';

  /* ===== DATA HEWAN A-Z ===== */
  const HEWAN = [
    ['A','Ayam','🐔'],['B','Bebek','🦆'],['C','Cicak','🦎'],['D','Domba','🐑'],
    ['E','Elang','🦅'],['F','Flamingo','🦩'],['G','Gajah','🐘'],['H','Harimau','🐯'],
    ['I','Ikan','🐟'],['J','Jerapah','🦒'],['K','Kucing','🐱'],['L','Lumba-Lumba','🐬'],
    ['M','Monyet','🐵'],['N','Nuri','🦜'],['O','Orangutan','🦧'],['P','Pinguin','🐧'],
    ['Q','Quokka','🐹'],['R','Rusa','🦌'],['S','Sapi','🐮'],['T','Tupai','🐿️'],
    ['U','Ular','🐍'],['V','Vicuna','🦙'],['W','Walrus','🦭'],['X','Xenopus','🐸'],
    ['Y','Yak','🐂'],['Z','Zebra','🦓']
  ].map(([huruf, nama, emoji]) => ({ huruf, nama, emoji }));

  const $ = id => document.getElementById(id);
  const layar = ['menu', 'flash', 'kuis'];
  const PUJIAN = ['Hebat! 🎉', 'Pintar sekali! 🌟', 'Benar! 👏', 'Keren! 🥳', 'Mantap! 💪'];
  const SEMANGAT = ['Ayo coba lagi! 💛', 'Hampir benar! 🍀', 'Tidak apa-apa, semangat! 🌈'];
  const JUMLAH_SOAL = 10;

  let idx = 0;
  let suaraId = null;

  /* ===== AUDIO (Web Speech API) ===== */
  const bisaBicara = 'speechSynthesis' in window;
  function pilihSuara() {
    if (!bisaBicara) return null;
    const v = speechSynthesis.getVoices();
    return v.find(x => x.lang === 'id-ID') || v.find(x => x.lang.toLowerCase().startsWith('id')) || null;
  }
  if (bisaBicara) speechSynthesis.onvoiceschanged = pilihSuara;

  function ucap(teks) {
    if (!bisaBicara) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(teks);
    u.lang = 'id-ID';
    u.rate = 0.85;
    u.pitch = 1.3;
    const s = pilihSuara();
    if (s) u.voice = s;
    speechSynthesis.speak(u);
  }

  /* ===== NAVIGASI LAYAR ===== */
  function tampil(nama) {
    layar.forEach(l => $(l).classList.toggle('tampil', l === nama));
    document.body.style.background = nama === 'flash' ? 'var(--hijau)' : nama === 'kuis' ? '#FFD966' : 'var(--kuning)';
    window.scrollTo(0, 0);
    if (bisaBicara) speechSynthesis.cancel();
  }
  window.keMenu = () => tampil('menu');

  /* ===== FLASHCARD ===== */
  function buatGrid() {
    $('grid').innerHTML = HEWAN.map((h, i) =>
      `<button class="huruf" data-i="${i}" aria-label="Huruf ${h.huruf}, ${h.nama}">${h.huruf}</button>`).join('');
    $('grid').addEventListener('click', e => {
      const b = e.target.closest('.huruf');
      if (b) { idx = +b.dataset.i; renderKartu(true); }
    });
  }

  function renderKartu(otomatisBicara) {
    const h = HEWAN[idx];
    $('kHuruf').textContent = h.huruf;
    $('kNama').textContent = h.nama.toUpperCase();
    $('kHalaman').textContent = `Kartu ${idx + 1} dari 26`;
    const em = $('kEmoji');
    em.textContent = h.emoji;
    em.classList.remove('kartu-isi'); void em.offsetWidth; em.classList.add('kartu-isi');
    document.querySelectorAll('.huruf').forEach((b, i) => b.classList.toggle('aktif', i === idx));
    $('btnPrev').disabled = idx === 0;
    $('btnNext').disabled = idx === HEWAN.length - 1;
    $('btnPrev').style.opacity = idx === 0 ? .4 : 1;
    $('btnNext').style.opacity = idx === HEWAN.length - 1 ? .4 : 1;
    if (otomatisBicara) bicara();
  }

  window.bukaFlashcard = (i = 0) => { idx = i; tampil('flash'); renderKartu(false); };
  window.geser = d => {
    const n = idx + d;
    if (n < 0 || n >= HEWAN.length) return;
    idx = n; renderKartu(true);
  };
  window.bicara = () => {
    const h = HEWAN[idx];
    ucap(`${h.huruf}... ${h.nama.replace('-', ' ')}!`);
    const em = $('kEmoji');
    em.classList.remove('goyang'); void em.offsetWidth; em.classList.add('goyang');
  };

  document.addEventListener('keydown', e => {
    if (!$('flash').classList.contains('tampil')) return;
    if (e.key === 'ArrowRight') geser(1);
    if (e.key === 'ArrowLeft') geser(-1);
  });

  /* ===== KUIS ===== */
  let soal = [], no = 0, benar = 0, salah = 0, skor = 0, terkunci = false, jawabanBenar = null;

  const acak = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  window.mulaiKuis = () => {
    soal = acak(HEWAN).slice(0, JUMLAH_SOAL).map(h => ({
      jawab: h,
      opsi: acak([h, ...acak(HEWAN.filter(x => x !== h)).slice(0, 2)]),
      mode: Math.random() < 0.5 ? 'gambar' : 'huruf'
    }));
    no = 0; benar = 0; salah = 0; skor = 0;
    $('hasil').classList.replace('flex', 'hidden');
    $('soalBox').style.display = 'flex';
    tampil('kuis');
    skorUI();
    tampilSoal();
  };

  function skorUI() {
    $('sSkor').textContent = skor;
    $('sBenar').textContent = benar;
    $('sSalah').textContent = salah;
    $('bar').style.width = (no / JUMLAH_SOAL * 100) + '%';
  }

  function tampilSoal() {
    const s = soal[no];
    terkunci = false;
    jawabanBenar = s.jawab;
    $('soalKe').textContent = `Soal ${no + 1} dari ${JUMLAH_SOAL}`;
    $('umpan').textContent = '';
    $('qHuruf').textContent = s.jawab.huruf;
    const em = $('qEmoji');
    em.textContent = s.mode === 'gambar' ? s.jawab.emoji : '❓';
    $('tanya').textContent = s.mode === 'gambar' ? 'Hewan apa ini? 🤔' : `Hewan apa yang huruf depannya "${s.jawab.huruf}"? 🤔`;
    $('pilihan').innerHTML = s.opsi.map((o, i) =>
      `<button class="pilihan text-2xl sm:text-xl py-5 px-3" data-i="${i}">${o.nama}</button>`).join('');
    skorUI();
    setTimeout(bacaSoal, 350);
  }

  window.bacaSoal = () => {
    const s = soal[no];
    if (!s) return;
    ucap(s.mode === 'gambar' ? 'Hewan apa ini?' : `Hewan apa yang huruf depannya ${s.jawab.huruf}?`);
  };

  $('pilihan').addEventListener('click', e => {
    const b = e.target.closest('.pilihan');
    if (!b || terkunci) return;
    terkunci = true;
    const s = soal[no];
    const dipilih = s.opsi[+b.dataset.i];
    const semua = [...document.querySelectorAll('.pilihan')];
    if (dipilih === jawabanBenar) {
      b.classList.add('benar');
      benar++; skor += 10;
      const p = PUJIAN[Math.floor(Math.random() * PUJIAN.length)];
      $('umpan').textContent = p;
      $('qEmoji').textContent = s.jawab.emoji;
      pesta();
      ucap(`${p.replace(/[^\p{L}\s!]/gu, '')} ${s.jawab.nama.replace('-', ' ')}!`);
    } else {
      b.classList.add('salah');
      salah++;
      const m = SEMANGAT[Math.floor(Math.random() * SEMANGAT.length)];
      $('umpan').textContent = m;
      semua[s.opsi.indexOf(jawabanBenar)].classList.add('benar');
      $('qEmoji').textContent = s.jawab.emoji;
      ucap(`Jawabannya ${s.jawab.nama.replace('-', ' ')}`);
    }
    semua.forEach(x => x.disabled = true);
    no++;
    skorUI();
    setTimeout(() => (no < JUMLAH_SOAL ? tampilSoal() : akhir()), 2200);
  });

  function akhir() {
    $('soalBox').style.display = 'none';
    $('soalKe').textContent = 'Selesai!';
    $('hasil').classList.replace('hidden', 'flex');
    $('hasilTeks').textContent = `Kamu menjawab ${benar} benar dari ${JUMLAH_SOAL} soal. Skor: ${skor}`;
    const n = benar >= 9 ? 3 : benar >= 6 ? 2 : 1;
    $('bintang').textContent = '⭐'.repeat(n) + '☆'.repeat(3 - n);
    pesta(); setTimeout(pesta, 600);
    ucap(`Hebat sekali! Kamu mendapat ${benar} jawaban benar!`);
  }

  /* ===== ANIMASI PERAYAAN ===== */
  function pesta() {
    const ikon = ['⭐', '🌟', '✨', '🎉', '🎈', '🦋'];
    for (let i = 0; i < 22; i++) {
      const el = document.createElement('div');
      el.className = 'konfeti';
      el.textContent = ikon[Math.floor(Math.random() * ikon.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.animationDelay = Math.random() * 0.5 + 's';
      el.style.fontSize = 1.4 + Math.random() * 1.6 + 'rem';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2600);
    }
  }

  /* ===== INIT ===== */
  buatGrid();
  renderKartu(false);
})();
